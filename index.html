<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="style.css"> -->
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Metu-404</title>
    </head>
<body>
<div class="flex">
    <div class="flex-1 bg-grey-100 h-screen items-center justify-center p-20">
        <div class="mt-36">
            <img src="https://images.pexels.com/photos/31256342/pexels-photo-31256342.jpeg?cs=srgb&dl=pexels-optical-chemist-340351297-31256342.jpg&fm=jpg" alt="Logo" class="w-20 h-20 mx-auto">
        </div>
        <div class="mb-4">
            <h1 class="text-2xl font-bold">Login</h1>
        </div>
        <div>
            <input type="text" name="" id=""  placeholder="Username" class="w-full rounded-xl border py-3 pl-10 pr-4 text-sm outline-none transition-all duraion-200 focus:ring-2">
        </div>
        <div class="mt-4">
            <input type="password" name="" id="" placeholder="password"  class="w-full rounded-xl border py-3 pl-10 pr-4 text-sm outline-none transition-all duraion-200 focus:ring-2">
        </div>
        <div class="mt-4">
            <button class="w-full bg-blue-500 text-white p-2 mt-2 rounded-x1">Login</button>
        </div>
    </div>
    <div id="box" class="flex-1 bg-purple-500 h-screen p-5 flex items-center justify-center text-white text-x1 font-bold">
        <p id="msg" class="text-white text-xl font-bold">Welcome to the purple section!</p>
     <div class="m-5">
         <button id="btn" class="bg-green-500 text-white p-2 rounded hover:bg-green-600 transition-colors duration-200">Click me</button>
         <button id="colorBtn" class="bg-yellow-500 text-white p-2 rounded hover:bg-yello-600 transition-200">Change color</button>
     </div>
    </div>
</div>
</body>
<script src="script.js"></script>
</html>
